# Nginx configuration for AIStock Server
# This configuration provides load balancing for multiple uvicorn workers

# Upstream configuration - multiple uvicorn workers for load balancing
upstream aistock_backend {
    # Use least_conn for better distribution
    least_conn;
    
    # Multiple uvicorn workers
    # Adjust the number of workers based on your server's CPU cores
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    server 127.0.0.1:8003;
    server 127.0.0.1:8004;
    
    # Health check settings
    # Uncomment if using nginx_upstream_check_module
    # check interval=3000 rise=2 fall=3 timeout=1000 type=http;
}

# Rate limiting zone - prevents DDoS and abuse
limit_req_zone $binary_remote_addr zone=aistock_limit:10m rate=10r/s;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.mcptools.xin mcptools.xin;
    
    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mcptools.xin mcptools.xin;
    
    # SSL Certificate Configuration
    # Update these paths to your actual certificate files
    ssl_certificate /etc/letsencrypt/live/mcptools.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcptools.xin/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mcptools.xin/chain.pem;
    
    # SSL Configuration - Modern and secure
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/aistock_access.log;
    error_log /var/log/nginx/aistock_error.log;
    
    # Max body size for file uploads
    client_max_body_size 10M;
    
    # Proxy to FastAPI application
    location / {
        # Apply rate limiting
        limit_req zone=aistock_limit burst=20 nodelay;
        
        proxy_pass http://aistock_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Admin interface - add basic auth for extra security
    location /admin {
        # Optional: Add basic authentication
        # auth_basic "Admin Area";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://aistock_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WeChat Pay callback - no rate limiting for payment notifications
    location /api/v1/payment/wechat/notify {
        limit_req off;  # Disable rate limiting for WeChat callbacks
        
        proxy_pass http://aistock_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static files (if any)
    location /static/ {
        alias /opt/aistock/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check endpoint - no rate limiting
    location /health {
        limit_req off;
        proxy_pass http://aistock_backend;
        access_log off;  # Don't log health checks
    }
}

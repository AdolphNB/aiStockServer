# Systemd service file for AIStock Server
# Place this file at: /etc/systemd/system/aistock.service
# 
# Usage:
#   sudo systemctl enable aistock    # Enable on boot
#   sudo systemctl start aistock     # Start service
#   sudo systemctl stop aistock      # Stop service
#   sudo systemctl restart aistock   # Restart service
#   sudo systemctl status aistock    # Check status
#   sudo journalctl -u aistock -f    # View logs

[Unit]
Description=AIStock Remote Server
After=network.target
Wants=network-online.target

[Service]
Type=notify
User=aistock
Group=aistock
WorkingDirectory=/opt/aistock/aiStockServer

# Environment variables
Environment="PATH=/opt/aistock/venv/bin:/usr/local/bin:/usr/bin:/bin"
Environment="PORT=8000"
Environment="DATABASE_URL=sqlite:////opt/aistock/data/aistock.db"

# WeChat Pay credentials (update with actual values)
# Environment="WECHAT_APPID=your_appid"
# Environment="WECHAT_MCHID=your_mchid"
# Environment="WECHAT_API_KEY=your_api_key"
# Environment="SERVER_URL=https://www.mcptools.xin"

# Gunicorn with multiple workers
# Number of workers = (2 x CPU cores) + 1
ExecStart=/opt/aistock/venv/bin/gunicorn app.main:app \
    --bind 127.0.0.1:8001 \
    --workers 4 \
    --worker-class uvicorn.workers.UvicornWorker \
    --timeout 60 \
    --graceful-timeout 30 \
    --max-requests 1000 \
    --max-requests-jitter 50 \
    --access-logfile /var/log/aistock/access.log \
    --error-logfile /var/log/aistock/error.log \
    --log-level info

# Restart policy
Restart=always
RestartSec=5
StartLimitInterval=0

# Security settings
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/opt/aistock/data /var/log/aistock

# Resource limits
LimitNOFILE=65535
LimitNPROC=4096

[Install]
WantedBy=multi-user.target

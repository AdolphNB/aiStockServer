[project]
name = "remote-server"
version = "0.1.0"
description = "AIStock Remote Server Data Hub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "gunicorn>=21.0.0",
    "numpy<2.3.0",
    "pandas>=1.5.0",
    "akshare>=1.10.0",
    "pandas-ta>=0.3.14b0",
    "apscheduler>=3.10.0",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "sqladmin>=0.16.0",
    "pydantic-settings",
    "requests",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "func-timeout>=4.3.5",
    "pyarrow>=23.0.0",
    "aiosqlite>=0.22.1",
    "polars>=1.37.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
